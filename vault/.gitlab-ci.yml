---
#################################################
# Requirements:                                 #
#   define the following secrets:               #
#     AWS_DEFAULT_REGION                        #
#     AWS_ACCESS_KEY_ID                         #
#     AWS_SECRET_ACCESS_KEY                     #
#################################################

#############################
# global definitions - init #
#############################
stages:
  - code-quality
  - validate
  - build
  - deploy
  - destroy
############
include:
  - project: "iac/terraform/core-ci"
    ref: cloud
    file: "vault/vault-rules.gitlab-ci.yml"
  - project: "iac/terraform/core-ci"
    ref: cloud
    file: "vault/base.yml"
  
#  - local: "base.yml"

############################
# global definitions - end #
########################

# job templates - init #
########################
.predefined_id_tokens:
  id_tokens:
    VAULT_ID_TOKEN:
      aud: '$VAULT_ADDR'

.prepare-init:
  script:
    - echo -e "credentials \"$CI_SERVER_HOST\" {\n  token = \"$CI_JOB_TOKEN\"\n}" > $TF_CLI_CONFIG_FILE
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    - git config --global user.email "ansible@nexdev.net"
    - git config --global user.name "ansible"
    - git config --global url."https://ansible:$CI_JOB_TOKEN@$CI_SERVER_HOST".insteadOf "https://$CI_SERVER_HOST"
    - ssh-keyscan -t rsa gitlab.nexdev.net >> ~/.ssh/known_hosts ;
    - echo "$CI_PROJECT_NAME - $CI_PROJECT_ID - $ORG - $CI_PROJECT_PATH - $VAULT_ENV - $VAULT_ADDR";
    - terraform --version
    - echo "$TF_COMMAND - $DIR_PATH - $CI_COMMIT_REF_NAME - $VAULT_ENV - $TF_VAR_vault_role"
    - echo "$ORG - $CI_COMMIT_REF_NAME - $VAULT_ENV - $VAULT_ADDR"
    # - cd $DIR_PATH
    # - export AWS_PROFILE=$VAULT_ENV
    # - aws configure list
    # - |
    #     echo "** Getting credentials"
    #     vault --version
    #     export VAULT_TOKEN="$(vault write -field=token auth/jwt/login role=$TF_VAR_vault_role jwt=$VAULT_ID_TOKEN)"
    #     vault token lookup
    # - terraform init -input=false --backend-config=env/$VAULT_ENV.conf


.prepare-workspace:
  script:
    - cd $DIR_PATH
    - export AWS_PROFILE=$VAULT_ENV
    - aws configure list
    - |
        echo "** Getting credentials"
        vault --version
        export VAULT_TOKEN="$(vault write -field=token auth/jwt/login role=$TF_VAR_vault_role jwt=$VAULT_ID_TOKEN)"
        vault token lookup
    - terraform init -input=false --backend-config=env/$VAULT_ENV.conf
    - (terraform workspace select ${CI_COMMIT_REF_NAME} ||
      terraform workspace new ${CI_COMMIT_REF_NAME})


.base-rules:
  rules:
    - if: $CI_COMMIT_REF_NAME != "prod" && $CI_COMMIT_REF_NAME != "kldr" && $CI_COMMIT_REF_NAME != "uat" && $CI_COMMIT_REF_NAME != "local" && $CI_COMMIT_REF_NAME != "dev" && $CI_COMMIT_REF_NAME != "testlab" && ($CI_JOB_STAGE != "validate" && $CI_JOB_STAGE != "code-quality")
      when: never
    - if: ($CI_COMMIT_REF_NAME == "prod" || $CI_COMMIT_REF_NAME == "kldr" || $CI_COMMIT_REF_NAME == "uat" || $CI_COMMIT_REF_NAME == "local" || $CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "testlab") && ($CI_JOB_STAGE == "validate" || $CI_JOB_STAGE == "code-quality")
      when: never
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - $RULES_CHANGES_PATH

.terraform_lint:
  stage: code-quality
  image:
    name: wata727/tflint:0.29.1
    entrypoint:
      - env
  script:
    - tflint

.terraform_fmt:
  stage: code-quality
  script:
    - terraform fmt -check

.yaml_lint:
  stage: code-quality
  allow_failure: true
  image:
    name: cytopia/yamllint:1
    entrypoint:
      - env
  script:
    - yamllint .

.markdown_lint:
  stage: code-quality
  image: pipelinecomponents/markdownlint:6ff4ccf
  script:
    - mdl --style all --warnings .

.validate_syntax:
  stage: validate
  script:
    - !reference [.prepare-init, script]
    - terraform validate

# Job: Checkov | Stage: Validate
# Purpose: Validate the Terraform configuration by applying security policies provided by Checkov
.validate_security_checkov:
  image:
    name: bridgecrew/checkov:latest
    entrypoint:
      - "/usr/bin/env"
      - "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  stage: validate
  script:
    - checkov -d .
  allow_failure: true

.validate_security:
  stage: validate
  script:
    - !reference [.prepare-init, script]
    - wget --no-verbose https://gitlab.nexdev.net/NEXOPS/tools/trivy-scan/-/raw/main/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz?inline=false -O - | tar -zxvf -
    - ls -l
    - ./trivy config --exit-code 1 --severity HIGH,CRITICAL .
    - echo completed on `date`
  allow_failure: true

.plan:
  stage: build
  extends:
    - .predefined_id_tokens
  script:
    - !reference [.prepare-init, script]
    - !reference [.prepare-workspace, script]
    - alias convert_report="jq -r '([.resource_changes[]?.change.actions?]|flatten)|{\"create\":(map(select(.==\"create\"))|length),\"update\":(map(select(.==\"update\"))|length),\"delete\":(map(select(.==\"delete\"))|length)}'"
    - terraform plan -var-file=env/$CI_COMMIT_REF_NAME.tfvars -out=${PLAN} # -lock=false
    - "terraform show -json $PLAN | convert_report > $JSON_PLAN_FILE"
  artifacts:
    name: $CI_COMMIT_REF_NAME
    reports:
      terraform: ${TF_ROOT}/$DIR_PATH/${JSON_PLAN_FILE}
    paths:
      - ${TF_ROOT}/$DIR_PATH/$PLAN
      - ${TF_ROOT}/$DIR_PATH/${JSON_PLAN_FILE}
    expire_in: 7 days

.apply:
  stage: deploy
  extends:
    - .predefined_id_tokens
  script:
    - !reference [.prepare-init, script]
    - !reference [.prepare-workspace, script]
    - terraform apply -input=false -auto-approve $PLAN
  when: manual
  allow_failure: false

##############################################################
#                       DANGER ZONE!                         #
# this job will destroy your infrastructure                  #
# use it only if you need to remove your Terraform resources #
##############################################################

.destroy:
  stage: destroy
  extends:
    - .predefined_id_tokens
  script:
    - !reference [.prepare-init, script]
    - !reference [.prepare-workspace, script]
    - terraform destroy -var-file="env/$CI_COMMIT_REF_NAME.tfvars" -auto-approve
  when: manual
  rules:
    - if: $CI_COMMIT_REF_NAME != "testlab"
      when: never
  allow_failure: false
