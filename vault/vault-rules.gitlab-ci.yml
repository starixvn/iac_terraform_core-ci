workflow:
  rules:
# ###NEXCEL
#     - if: '($CI_PROJECT_ID == "2660" || $CI_PROJECT_ID == "1897" )'
#       variables:
#         ORG: "nexcel"
# ###LUMI
#     - if: '($CI_PROJECT_ID == "2702")'
#       variables:
#         ORG: "luminet"

    # Conditions set variable for NEXCEL
    - if: '$ORG == "nexcel" && $CI_COMMIT_REF_NAME == "main"'
      variables:
        VAULT_ENV: "dev"
        VAULT_ADDR: "https://vault-dev.nexdev.net"
    - if: '$ORG == "nexcel" && $CI_COMMIT_REF_NAME == "testlab"'
      variables:
        VAULT_ENV: "testlab"
        VAULT_ADDR: "http://10.70.70.142:8200"
    - if: '$ORG == "nexcel" && $CI_COMMIT_REF_NAME == "dev"'
      variables:
        VAULT_ENV: "dev"
        VAULT_ADDR: "https://vault-dev.nexdev.net"
    - if: '$ORG == "nexcel" && $CI_COMMIT_REF_NAME == "local"'
      variables:
        VAULT_ENV: "local"
        VAULT_ADDR: "https://vault.nexdev.net"
    - if: '$ORG == "nexcel" && $CI_COMMIT_REF_NAME == "uat"'
      variables:
        VAULT_ENV: "uat"
        VAULT_ADDR: "https://vault.starixuat.com"
    - if: '$ORG == "nexcel" && $CI_COMMIT_REF_NAME == "prod"'
      variables:
        VAULT_ENV: "prod"
        VAULT_ADDR: "https://vault.starixplay.com"
    - if: '$ORG == "nexcel" && $CI_COMMIT_REF_NAME == "kldr"'
      variables:
        VAULT_ENV: "kldr"
        VAULT_ADDR: "https://vn-st-vault.byb6181.com"
    - if: '$ORG == "nexcel" && $CI_COMMIT_REF_NAME == "sit"'
      variables:
        VAULT_ENV: "sit"
        VAULT_ADDR: "https://vault.playonesit.com"

    # Conditions set variable for LUMINET
    - if: '$ORG == "luminet" && $CI_COMMIT_REF_NAME == "main"'
      variables:
        VAULT_ENV: "local"
        VAULT_ADDR: "https://vault.lumigame.com"
    - if: '$ORG == "luminet" && $CI_COMMIT_REF_NAME == "local"'
      variables:
        VAULT_ENV: "local"
        VAULT_ADDR: "https://vault.lumigame.com"
    - if: '$ORG == "luminet" && $CI_COMMIT_REF_NAME == "uat"'
      variables:
        VAULT_ENV: "uat"
        VAULT_ADDR: "https://vault.uat"
    - if: '$ORG == "luminet" && $CI_COMMIT_REF_NAME == "prod"'
      variables:
        VAULT_ENV: "prod"
        VAULT_ADDR: "https://vault.prod"
    - if: '$ORG == "luminet" && $CI_COMMIT_REF_NAME == "kldr"'
      variables:
        VAULT_ENV: "kldr"
        VAULT_ADDR: "https://vault.kldr"