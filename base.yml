image:
  name: $DOCKER_REG_LOCAL_URL/base/hashicorp/terraform:1.4.5-vault
  entrypoint:
      - "/usr/bin/env"
      - "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

variables:
  RULES_CHANGES_PATH: "**/*"
  TF_ROOT: ${CI_PROJECT_DIR}
  PLAN: plan.tfplan
  JSON_PLAN_FILE: tfplan.json
  TF_CLI_CONFIG_FILE: $CI_PROJECT_DIR/.terraformrc
  TRIVY_VERSION: "0.24.2"
  TRIVY_TOKEN: "H5nF5ywy262wt881ZWpq"
  TRIVY_SERVER: "http://10.18.200.160:1115"
  ###
  VAULT_ADDR: https://vault.nexdev.net
  VAULT_VERSION: 1.15.2 #1.6.2
  TF_VAR_vault_role: tf-aws-auth-role-pipeline
  TF_VAR_vault_backend: aws_local

cache:
  - key: $DIR_PATH-$CI_COMMIT_REF_NAME-$AWS_PROFILE-terraform
    paths:
      - $DIR_PATH/.terraform
  - key: $DIR_PATH-$CI_COMMIT_REF_NAME-$AWS_PROFILE-terraform.lock.hcl
    paths:
      - $DIR_PATH/.terraform.lock.hcl
