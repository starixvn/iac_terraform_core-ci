image:
  name: $DOCKER_REG_LOCAL_URL/base/hashicorp/terraform:1.4.5
  entrypoint:
      - "/usr/bin/env"
      - "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

variables:
  RULES_CHANGES_PATH: "**/*"
  TF_ROOT: ${CI_PROJECT_DIR}
  PLAN: plan.tfplan
  JSON_PLAN_FILE: tfplan.json
  TF_CLI_CONFIG_FILE: $CI_PROJECT_DIR/.terraformrc
  SSH_PRIVATE_KEY_4: ""
before_script:
  - echo -e "credentials \"$CI_SERVER_HOST\" {\n  token = \"$CI_JOB_TOKEN\"\n}" > $TF_CLI_CONFIG_FILE
  - eval $(ssh-agent -s)
  - mkdir -p ~/.ssh
  - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  - git config --global user.email "ansible@nexdev.net"
  - git config --global user.name "ansible"
  - echo -e "${SSH_PRIVATE_KEY_1}\n${SSH_PRIVATE_KEY_2}\n${SSH_PRIVATE_KEY_3}\n${SSH_PRIVATE_KEY_4}" | ssh-add -
  - ssh-keyscan -t rsa gitlab.nexdev.net >> ~/.ssh/known_hosts ;
  - if echo $CI_COMMIT_REF_NAME | grep -q "test"; then export AWS_PROFILE=test;
      elif echo $CI_COMMIT_REF_NAME | grep -q "local"; then export AWS_PROFILE=local;
      elif echo $CI_COMMIT_REF_NAME | grep -q "uat"; then export AWS_PROFILE=uat;
      elif echo $CI_COMMIT_REF_NAME | grep -q "prod"; then export AWS_PROFILE=prod;
    fi;
cache:
  - key: $DIR_PATH-$CI_COMMIT_REF_NAME-terraform
    paths:
      - $DIR_PATH/.terraform
  - key: $DIR_PATH-$CI_COMMIT_REF_NAME-terraform.lock.hcl
    paths:
      - $DIR_PATH/.terraform.lock.hcl
