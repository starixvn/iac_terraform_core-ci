---
#################################################
# Requirements:                                 #
#   define the following secrets:               #
#     AWS_DEFAULT_REGION                        #
#     AWS_ACCESS_KEY_ID                         #
#     AWS_SECRET_ACCESS_KEY                     #
#################################################

#############################
# global definitions - init #
#############################
stages:
  - code-quality
  - validate
  - build_vpc
  - deploy_vpc
  - build_sg_iam
  - deploy_sg_iam
  - build_ec2
  - deploy_ec2
  - build_lb
  - deploy_lb
  - build_eks
  - deploy_eks
  - destroy_lb
  - destroy_ec2
  - destroy_eks
  - destroy_sg_iam
  - destroy_vpc
############
include:
  - local: "base.yml"
############################
# global definitions - end #
########################

# job templates - init #
########################
.prepare-init:
  script:
    - echo -e "credentials \"$CI_SERVER_HOST\" {\n  token = \"$CI_JOB_TOKEN\"\n}" > $TF_CLI_CONFIG_FILE
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    - git config --global user.email "ansible@nexdev.net"
    - git config --global user.name "ansible"
    - ssh-keyscan -t rsa gitlab.nexdev.net >> ~/.ssh/known_hosts ;
    - if echo $CI_COMMIT_REF_NAME | grep -q "main"; then export AWS_ENV=testlab;
        elif echo $CI_COMMIT_REF_NAME | grep -q "testlab"; then export AWS_ENV=testlab;export VAULT_ADDR="https://vault.nexdev.net";
        elif echo $CI_COMMIT_REF_NAME | grep -q "local"; then export AWS_ENV=local; export VAULT_ADDR="https://vault.nexdev.net";
        elif echo $CI_COMMIT_REF_NAME | grep -q "uat"; then export AWS_ENV=uat;
        elif echo $CI_COMMIT_REF_NAME | grep -q "prod"; then export AWS_ENV=prod;
      fi;
    - |
      echo "** Getting AWS credentials"
      vault --version
      export VAULT_TOKEN="$(vault write -field=token auth/jwt/login role=$TF_VAR_vault_role jwt=$CI_JOB_JWT)"
      vault token lookup
      export CREDS=$(vault write -format=json $TF_VAR_vault_backend/sts/$TF_VAR_vault_assumed ttl=20m)
      export AWS_ACCESS_KEY_ID=$(echo ${CREDS} | jq -r .data.access_key)
      echo $AWS_ACCESS_KEY_ID
      export AWS_SECRET_ACCESS_KEY=$(echo ${CREDS} | jq -r .data.secret_key)
      export AWS_SESSION_TOKEN=$(echo ${CREDS} | jq -r .data.security_token)
      export AWS_DEFAULT_REGION="ap-northeast-1"
      aws sts get-caller-identity
    - terraform --version
    - echo "$TF_COMMAND - $DIR_PATH - $CI_COMMIT_REF_NAME - $AWS_ENV"
    - cd $DIR_PATH
    - aws configure list
    - terraform init -input=false --backend-config=env/$AWS_ENV.conf

.prepare-workspace:
  script:
    - (terraform workspace select ${CI_COMMIT_REF_NAME} ||
      terraform workspace new ${CI_COMMIT_REF_NAME})

.base-rules:
  rules:
    - if: $CI_COMMIT_REF_NAME != "prod" && $CI_COMMIT_REF_NAME != "uat" && $CI_COMMIT_REF_NAME != "local" && $CI_COMMIT_REF_NAME != "testlab" && ($CI_JOB_STAGE != "validate" && $CI_JOB_STAGE != "code-quality")
      when: never
    - if: ($CI_COMMIT_REF_NAME == "prod" || $CI_COMMIT_REF_NAME == "uat" || $CI_COMMIT_REF_NAME == "local" || $CI_COMMIT_REF_NAME == "testlab") && ($CI_JOB_STAGE == "validate" || $CI_JOB_STAGE == "code-quality")
      when: never
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - $RULES_CHANGES_PATH

.terraform_lint:
  stage: code-quality
  image:
    name: wata727/tflint:0.29.1
    entrypoint:
      - env
  script:
    - tflint

.terraform_fmt:
  stage: code-quality
  script:
    - terraform fmt -check

.yaml_lint:
  stage: code-quality
  allow_failure: true
  image:
    name: cytopia/yamllint:1
    entrypoint:
      - env
  script:
    - yamllint .

.markdown_lint:
  stage: code-quality
  image: pipelinecomponents/markdownlint:6ff4ccf
  script:
    - mdl --style all --warnings .

.validate_syntax:
  stage: validate
  script:
    - !reference [.prepare-init, script]
    - terraform validate

# Job: Checkov | Stage: Validate
# Purpose: Validate the Terraform configuration by applying security policies provided by Checkov
# .validate_security_checkov:
#   image:
#     name: bridgecrew/checkov:latest
#     entrypoint:
#       - "/usr/bin/env"
#       - "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
#   stage: validate
#   script:
#     - checkov -d .
#   allow_failure: true

.validate_security:
  stage: validate
  script:
    - !reference [.prepare-init, script]
    - wget --no-verbose https://gitlab.nexdev.net/NEXOPS/tools/trivy-scan/-/raw/main/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz?inline=false -O - | tar -zxvf -
    - ls -l
    - ./trivy config --exit-code 1 --severity HIGH,CRITICAL .
    - echo completed on `date`
  allow_failure: true

.plan:
  stage: build
  script:
    - !reference [.prepare-init, script]
    - !reference [.prepare-workspace, script]
    - alias convert_report="jq -r '([.resource_changes[]?.change.actions?]|flatten)|{\"create\":(map(select(.==\"create\"))|length),\"update\":(map(select(.==\"update\"))|length),\"delete\":(map(select(.==\"delete\"))|length)}'"
    - terraform plan -var-file=env/$CI_COMMIT_REF_NAME.tfvars -out=${PLAN} # -lock=false
    - "terraform show -json $PLAN | convert_report > $JSON_PLAN_FILE"
  artifacts:
    name: $CI_COMMIT_REF_NAME
    reports:
      terraform: ${TF_ROOT}/$DIR_PATH/${JSON_PLAN_FILE}
    paths:
      - ${TF_ROOT}/$DIR_PATH/$PLAN
      - ${TF_ROOT}/$DIR_PATH/${JSON_PLAN_FILE}
    expire_in: 7 days

.apply:
  stage: deploy
  script:
    - !reference [.prepare-init, script]
    - !reference [.prepare-workspace, script]
    - terraform apply -input=false -auto-approve $PLAN
  #when: manual
  allow_failure: false

##############################################################
#                       DANGER ZONE!                         #
# this job will destroy your infrastructure                  #
# use it only if you need to remove your Terraform resources #
##############################################################

.destroy:
  stage: destroy
  script:
    - !reference [.prepare-init, script]
    - !reference [.prepare-workspace, script]
    - terraform destroy -var-file="env/$CI_COMMIT_REF_NAME.tfvars" -auto-approve
  when: manual
  rules:
    - if: $CI_COMMIT_REF_NAME != "testlab"
      when: never
  allow_failure: false
