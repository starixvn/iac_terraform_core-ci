stages:
  - validate
  - build
  - deploy
############
include:
  - local: "base.yml"

###########
.prepare-init:
  script:
    #- terraform --version
    - echo "$TF_COMMAND - $DIR_PATH - $CI_COMMIT_REF_NAME - $AWS_PROFILE"
    - cd $DIR_PATH
    - aws configure list
    #- SOURCE="prod"
    #- if [ $CI_COMMIT_REF_NAME != "prod" ]; then SOURCE="test"; fi;
    - terraform init -input=false --backend-config=env/$AWS_PROFILE.conf

.prepare-workspace:
  script:
    - terraform workspace select $CI_COMMIT_REF_NAME

.base-rules:
  rules:
    - if: $CI_COMMIT_REF_NAME != "prod" && $CI_COMMIT_REF_NAME != "local" && $CI_COMMIT_REF_NAME != "testlab" && $CI_JOB_STAGE != "validate"
      when: never
    - if: ($CI_COMMIT_REF_NAME == "prod" || $CI_COMMIT_REF_NAME == "local" || $CI_COMMIT_REF_NAME == "testlab") && $CI_JOB_STAGE == "validate"
      when: never
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - $RULES_CHANGES_PATH

.validate_syntax:
  stage: validate
  script:
    - !reference [.prepare-init, script]
    - terraform validate

# Job: Checkov | Stage: Validate
# Purpose: Validate the Terraform configuration by applying security policies provided by Checkov
.validate_security_checkov:
  image:
    name: bridgecrew/checkov:latest
    entrypoint:
      - "/usr/bin/env"
      - "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  stage: validate
  script:
    - checkov -d .
  allow_failure: true

.validate_security:
  stage: validate
  script:
    - wget --no-verbose https://gitlab.nexdev.net/NEXOPS/tools/trivy-scan/-/raw/main/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz?inline=false -O - | tar -zxvf -
    - ls -l 
    - ./trivy conf --skip-dirs="*/.terraform/*,**/.terraform/*" --exit-code 1 --severity HIGH,CRITICAL .
    - echo "done Scan Config!"
  allow_failure: true

.plan:
  stage: build
  script:
    - !reference [.prepare-init, script]
    - !reference [.prepare-workspace, script]
    - alias convert_report="jq -r '([.resource_changes[]?.change.actions?]|flatten)|{\"create\":(map(select(.==\"create\"))|length),\"update\":(map(select(.==\"update\"))|length),\"delete\":(map(select(.==\"delete\"))|length)}'"
    - terraform plan -var-file=env/$CI_COMMIT_REF_NAME.tfvars -out=${PLAN} # -lock=false
    - "terraform show -json $PLAN | convert_report > $JSON_PLAN_FILE"
  artifacts:
    name: $CI_COMMIT_REF_NAME
    reports:
      terraform: ${TF_ROOT}/$DIR_PATH/${JSON_PLAN_FILE}
    paths:
      - ${TF_ROOT}/$DIR_PATH/$PLAN
      - ${TF_ROOT}/$DIR_PATH/${JSON_PLAN_FILE}
    expire_in: 7 days

.apply:
  stage: deploy
  script:
    - !reference [.prepare-init, script]
    - !reference [.prepare-workspace, script]
    #- terraform $TF_COMMAND -var-file=env/$CI_COMMIT_REF_NAME.tfvars -input=false -auto-approve
    - terraform apply -input=false -auto-approve $PLAN
  when: manual
  allow_failure: false
